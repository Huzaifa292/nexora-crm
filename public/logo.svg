<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7967FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7967FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle glow -->
  <circle cx="50" cy="50" r="38" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)"/>
  <!-- Isometric 3D Hexagon / Cube Nodes -->
  <path d="M50 15 L82 33.5 V70.5 L50 89 L18 70.5 V33.5 Z" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round" fill="rgba(21, 30, 48, 0.7)"/>
  <!-- 3D Internal Isometric facets -->
  <path d="M50 15 L50 51 L82 70.5" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 51 L18 70.5" stroke="url(#innerGlow)" stroke-width="3" stroke-linecap="round"/>
  <!-- Center Core glowing node -->
  <circle cx="50" cy="51" r="6" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="50" cy="51" r="3" fill="#FFFFFF"/>
</svg>

